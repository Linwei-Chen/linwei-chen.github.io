---
layout: default
---

<header>
  <h1>{{ page.title }}</h1>
  <p class="page__meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>{% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: " / " }}{% endif %}
  </p>
</header>

{{ content }}

<hr>

<p><a href="{{ '/blog/' | relative_url }}" target="_self">← 返回博客</a></p>
